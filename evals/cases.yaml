# Each case runs its messages in one session; checks apply to the final turn.
# Case keys besides messages/expect: logged_in, current_path, client (website | discord, default website).
# expect keys (all optional):
#   tools / forbid_tools   tool names that must / must not be called
#   tool_args              {tool: {arg: substring}} -- some call of that tool has arg containing substring
#   no_tool_errors         default true -- fail if any tool result is an error
#   contains / contains_any / not_contains   case-insensitive substrings of the reply
#   max_chars              fail if the reply is longer than this
#   judge                  rubric for the LLM judge
#
# Facts below are from the live catalog as of 2026-11-07: 34 knives from Squid Industries and Nabalis.
# Cheapest are the Nabalis Canyon and Impulse (from $40); titanium handles are Tsunami, Titanium Krake Raken,
# Madko, Hydro. Learn rubrics follow the web repo's src/data/learnContent.ts.

# --- Catalog ---
- id: catalog-tsunami-blade-steel
  category: catalog
  messages: ["What's the blade steel on the Squid Industries Tsunami?"]
  expect:
    tools: [search_knife_catalog]
    contains: [S35VN]

- id: catalog-mako-pivot
  category: catalog
  messages: ["What pivot system does the Mako use?"]
  expect:
    tools: [search_knife_catalog]
    contains: [washer]

- id: catalog-tsunami-page-link
  category: catalog
  messages: ["Tell me about the Tsunami"]
  expect:
    contains: [/product-world/knife/squid-industries-tsunami]

- id: catalog-tsunami-trainer-price
  category: catalog
  messages: ["How much is a Tsunami trainer?"]
  expect:
    contains_any: ["474", "475"]

- id: catalog-titanium-filter
  category: catalog
  messages: ["Any titanium-handled balisongs in the catalog?"]
  expect:
    tool_args:
      search_knife_catalog: {handle_material: TITANIUM}
    contains: [tsunami]

- id: catalog-budget-filter
  category: catalog
  messages: ["What's the cheapest knife you have listed? Under $100 ideally."]
  expect:
    contains_any: [canyon, impulse]

- id: catalog-maker
  category: catalog
  messages: ["What knives does Squid Industries make?"]
  expect:
    tools: [get_maker_details]
    contains: [/product-world/maker/squid-industries]

- id: catalog-maker-nabalis
  category: catalog
  messages: ["What does Nabalis make?"]
  expect:
    tools: [get_maker_details]
    contains: [/product-world/maker/nabalis]

- id: catalog-knife-not-listed
  category: catalog
  messages: ["Tell me about the BRS Replicant"]
  expect:
    tools: [search_knife_catalog]
    judge: >-
      The catalog search returns no match, so Latch says the catalog doesn't have that knife yet. It states no
      specs, materials, maker details, or prices for it -- any such detail would have to come from memory.

- id: catalog-krake-raken-grounded
  category: catalog
  messages: ["Tell me about the Krake Raken"]
  expect:
    tools: [get_knife_details]
    contains: [/product-world/knife/squid-industries-krake-raken]
    judge: >-
      Every factual claim about the Krake Raken -- specs, materials, pivot/pin/latch system, prices, versions,
      release years, and where to buy or availability -- is supported by a tool result shown in the transcript.
      Fail if any claim has no support in the tool results, even if it might be true.

- id: catalog-vulp-pins
  category: catalog
  messages: ["Does the Vulp have zen pins?"]
  expect:
    tools: [get_knife_details]
    judge: Latch says yes, the Nabalis Vulp uses zen pins, based on the tool result.

- id: catalog-direct-price
  category: catalog
  messages: ["How much is a Squiddy?"]
  expect:
    contains_any: ["49.99", "$50"]
    max_chars: 400
    judge: >-
      Latch answers the price directly and briefly. It does not dump the knife's full spec sheet or version
      history when only the price was asked.

- id: catalog-compare
  category: catalog
  messages: ["Tsunami or Krake Raken, which should I get?"]
  expect:
    tools: [get_knife_details]
    contains: [/product-world/knife/squid-industries-tsunami, /product-world/knife/squid-industries-krake-raken]
    judge: >-
      Latch compares the two knives on real differences from the tool results (e.g. handle material, pivot
      system, price) and gives a useful recommendation or tells the user what the choice depends on. Every
      spec and price it cites is supported by the tool results.

# --- Terminology ---
- id: terms-zen-pins
  category: terminology
  messages: ["What are zen pins?"]
  expect:
    contains: [handle]
    judge: >-
      Latch says zen pins are stop pins set inside the handles (instead of in the tang) that the tang rests
      against when the knife is open or closed. It must not describe zen pins as a pivot, a pivot system, or a
      single pin running through both handles.

- id: terms-discord-zen-pins
  category: terminology
  client: discord
  messages: ["In one sentence, what is a zen pin?"]
  expect:
    forbid_tools: [web_search]
    contains: [handle]
    judge: >-
      Latch says a zen pin is a stop pin set inside the handles (instead of in the tang) that the tang rests
      against. It must not describe a zen pin as a pivot, a pivot system, or a single pin running through
      both handles.

- id: terms-discord-tang-vs-zen
  category: terminology
  client: discord
  messages: ["What's the difference between tang pins and zen pins?"]
  expect:
    forbid_tools: [web_search]
    judge: >-
      Latch says tang pins are set in the blade's tang and the handles stop against them, while zen pins are set
      inside the handles and the tang stops against them. Neither is described as a pivot.

# --- Posts ---
- id: posts-tutorial-filter
  category: posts
  messages: ["Show me trick tutorial posts"]
