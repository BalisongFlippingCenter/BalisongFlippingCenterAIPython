      search_posts: {difficulty_tag: INTERMEDIATE}

- id: posts-for-sale
  category: posts
  messages: ["Is anyone selling knives right now?"]
  expect:
    contains_any: [/product-world, /community]

- id: posts-free-text
  category: posts
  messages: ["Find posts about rollovers"]
  expect:
    tools: [search_posts]

# --- Profiles ---
- id: profile-lookup
  category: profiles
  messages: ["Look up the user QSwKLegacy895"]
  expect:
    tools: [get_account_profile]
    contains: [/QSwKLegacy895/4241]

- id: profile-collection
  category: profiles
  messages: ["What knives does QSwKLegacy895 have in their collection?"]
  expect:
    tools: [get_collection]

# --- Learn & navigation ---
- id: learn-bushing
  category: learn-navigation
  messages: ["What is a bushing?"]
  expect:
    contains: [/learn/bushings-vs-washers-vs-bearings]

- id: learn-legality
  category: learn-navigation
  messages: ["Is it legal to carry a balisong?"]
  expect:
    contains: [/learn/balisong-legality]

- id: learn-first-knife
  category: learn-navigation
  messages: ["What should I get as my first balisong?"]
  expect:
    contains: [/learn/how-to-choose-your-first-balisong]

- id: learn-washers-vs-bearings
  category: learn-navigation
  messages: ["Washers or bearings, what's the difference?"]
  expect:
    contains: [/learn/bushings-vs-washers-vs-bearings]
    judge: >-
      Latch's explanation agrees with the site's Learn page: washers are flat rings (commonly phosphor bronze or
      Teflon) between the handle and tang; bearings (IKBS) use small ball bearings for a very smooth,
      free-spinning, often clicky action but need more cleaning and maintenance. It says nothing that contradicts
      this.

- id: learn-latchless
  category: learn-navigation
  messages: ["Should I take the latch off my balisong?"]
  expect:
    contains: [/learn/latch-types]
    judge: >-
      Latch's answer agrees with the site's Learn page: latchless is the overwhelming preference among
      experienced flippers because the latch can get in the flip path and disrupt tricks or catch fingers, and
      many knives ship with a removable latch. It treats it as personal preference, not a rule.

- id: learn-channel-vs-sandwich
  category: learn-navigation
  messages: ["Channel or sandwich handles?"]
  expect:
    contains: [/learn/handle-types]
    judge: >-
      Latch's answer agrees with the site's Learn page: channel handles are machined from one piece with a channel
      for the blade, stiffer and heavier with a solid feel; sandwich handles are outer scales on inner liners,
      lighter, with swappable scales for customization. It says nothing that contradicts this.

- id: nav-trick-clips
  category: learn-navigation
  messages: ["Where can I see other people's trick clips?"]
  expect:
    contains: [/community]

- id: nav-where-to-buy
  category: learn-navigation
  messages: ["Where do I go to buy a balisong?"]
  expect:
    contains: [/product-world]
    judge: >-
      Latch points to /product-world (the marketplace search of Buy/Sell and Trade posts) and/or Buy/Sell posts in
      /community. It must not describe an individual /product-world/knife/... or /product-world/maker/... page as
      having user listings or for-sale posts. Saying a knife page has specs and links to retailers or the maker's
      store is fine -- knife pages do show where-to-find links.

- id: nav-beginner-mentoring
  category: learn-navigation
  messages: ["I just got my first trainer, how do I start?"]
  expect:
    contains: [/tutorial-center]
    judge: >-
      Before routing to /tutorial-center, Latch briefly teaches real fundamentals itself -- at least two of:
      practicing on a trainer, safe handle vs bite handle, or naming a beginner trick such as basic fanning.
      The answer stays brief (a few sentences, not a full write-up).

# --- Reporting ---
- id: report-logged-out
  category: reporting
  logged_in: false
  current_path: /post/2
  messages: ["This post is spam, report it"]
  expect:
    forbid_tools: [report_content]
    judge: >-
      Latch plainly tells the user they need to create a free account and log in to report. It does not
      suggest a report button, contacting support, or any other workaround.

- id: report-current-page
  category: reporting
  logged_in: true
  current_path: /post/2
  messages: ["Report this post, it's spam"]
  expect:
    tool_args:
      report_content: {target_type: POST, target_id: "2", reason: SPAM}

- id: report-ambiguous-target
  category: reporting
  logged_in: true
  messages: ["I want to report something"]
  expect:
    forbid_tools: [report_content]
    judge: Latch asks the user what they want to report instead of guessing a target.

- id: report-profile-name
  category: reporting
  logged_in: true
  messages: ["The user QSwKLegacy895 has an offensive display name, flag it"]
  expect:
    tool_args:
      report_content: {target_type: PROFILE, reason: INAPPROPRIATE_NAME}

# --- Style ---
- id: style-no-markdown
  category: style
  messages: ["Compare bushings and bearings for me"]
  expect:
    not_contains: ["**", "](", "`"]

- id: style-casual-greeting
  category: style
  messages: ["hey"]
  expect:
    judge: >-
      The reply is short and casual, like a fellow flipper texting back. No corporate phrasing such as
      "I'd be happy to help", "great question", or "let me know if there's anything else", and no menu of
      offered services.

# --- Multi-turn ---
- id: followup-live-blade-price
  category: multi-turn
  messages: ["Tell me about the Tsunami", "How much does the live blade cost?"]
  expect:
    contains: ["750"]

- id: followup-titanium-version
  category: multi-turn
  messages: ["Tell me about the Krake Raken", "Is there a titanium version?"]
  expect:
    contains: [/product-world/knife/squid-industries-titanium-krake-raken]

- id: followup-collection-pronoun
  category: multi-turn
  messages: ["Look up QSwKLegacy895", "What's in their collection?"]
  expect:
    tools: [get_collection]

- id: followup-report-from-results
  category: multi-turn
  logged_in: true
  messages: ["Show me trick tutorial posts", "Report the first one as misinformation"]
  expect:
    tool_args:
      report_content: {target_type: POST, reason: MISINFORMATION}

# --- Discord ---
# web_search needs BRAVE_SEARCH_API_KEY; without it the tool returns an error result, so these cases don't fail
# on tool errors and instead check that Latch stays honest about what it found.
- id: discord-catalog-knife
  category: discord
  client: discord
  messages: ["tell me about the tsunami"]
  expect:
    tools: [get_knife_details]
    contains: [<https://www.balisongflippingcenter.com/product-world/knife/squid-industries-tsunami>]
    max_chars: 1500
    judge: Every spec and price Latch states is supported by the tool results shown.

- id: discord-not-in-catalog
  category: discord
  client: discord
  messages: ["what's the BRS Replicant like?"]
  expect:
    tools: [search_knife_catalog, web_search]
    no_tool_errors: false
    judge: >-
      Latch states no specs, prices, or release details for the BRS Replicant unless they appear in a tool result
      shown in the transcript. If the web search failed or found nothing useful, it says it couldn't find details
      rather than filling in from memory.

- id: discord-off-topic
  category: discord
  client: discord
  messages: ["what's the best pizza topping?"]
  expect:
    forbid_tools: [web_search]
    judge: Latch briefly says it's a balisong bot and doesn't answer the pizza question at length.
