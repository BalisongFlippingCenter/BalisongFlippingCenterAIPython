name: Deploy AI Service to Testing

# runs when code is merged to test or directly pushed to test
on:
  push:
    branches:
      - test

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TESTING_AI_SERVICE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image
        env:
          ECR_URL: ${{ vars.AWS_TESTING_ECR_REPOSITORY_URL }}
        run: |
          docker build --no-cache -t "$ECR_URL:${{ github.sha }}" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:${{ github.sha }}"
          docker push "$ECR_URL:latest"

      # Not reachable via a public health-check URL -- the AI instance's
      # security group only allows port 8001 from the backend instance, not
      # the internet (see testing/infra/security_groups.tf) -- so the health
      # check runs inside this same SSM command instead of a separate curl
      # step. Same rationale as deploy-ai-service-to-prod.yml.
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_TESTING_EC2_INSTANCE_ID }}
          ECR_URL: ${{ vars.AWS_TESTING_ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          REGISTRY="${ECR_URL%%/*}"

          # Re-pull every /balisong/testing/ai-service/ SSM param into .env
          # before each deploy -- same rationale as
          # deploy-server-to-test.yml: user_data only writes .env once at
          # first boot, so a newly-added SSM parameter (e.g.
          # AI_SERVICE_SHARED_SECRET, REDIS_URL) never reaches the running
          # container until someone manually refreshes it.
          ENV_REFRESH='aws ssm get-parameters-by-path --path /balisong/testing/ai-service/ --with-decryption --region us-east-1 --query "Parameters[*].[Name,Value]" --output text > /tmp/params.txt && : > /home/ec2-user/.env && while IFS=$(printf "\t") read -r name value; do echo "${name##*/}=$value" >> /home/ec2-user/.env; done < /tmp/params.txt && chmod 600 /home/ec2-user/.env && chown ec2-user:ec2-user /home/ec2-user/.env && rm -f /tmp/params.txt'

          COMMANDS=$(jq -n --arg registry "$REGISTRY" --arg envrefresh "$ENV_REFRESH" '[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \($registry)",
            $envrefresh,
            "cd /home/ec2-user",
            "docker-compose pull ai-service",
            "docker-compose up -d --no-deps --force-recreate ai-service",
            "docker image prune -af",
            "for i in $(seq 1 30); do curl -fsS http://localhost:8001/health && exit 0; sleep 5; done; exit 1"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
