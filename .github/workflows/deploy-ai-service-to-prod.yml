name: Deploy AI Service to Production

# runs when code is merged to main or directly pushed to main
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_AI_SERVICE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image
        env:
          ECR_URL: ${{ vars.AWS_AI_SERVICE_ECR_REPOSITORY_URL }}
        run: |
          docker build --no-cache -t "$ECR_URL:${{ github.sha }}" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:${{ github.sha }}"
          docker push "$ECR_URL:latest"

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_AI_SERVICE_EC2_INSTANCE_ID }}
          ECR_URL: ${{ vars.AWS_AI_SERVICE_ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          REGISTRY="${ECR_URL%%/*}"
          COMMANDS=$(jq -n --arg registry "$REGISTRY" '[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \($registry)",
            "cd /home/ec2-user",
            "docker-compose pull ai-service",
            "docker-compose up -d --no-deps --force-recreate ai-service",
            "docker image prune -af",
            "curl -fsS http://localhost:8001/health"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
