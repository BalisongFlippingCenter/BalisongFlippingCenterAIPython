name: Deploy AI Service to Production

# runs when code is merged to main or directly pushed to main
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temporary debug step -- prints only the sub/aud claims (never the
      # token itself) to confirm what subject the IAM trust policy needs to
      # match. Remove once the OIDC assume-role issue is resolved.
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, repository, repository_owner, ref}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_AI_SERVICE_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image
        env:
          ECR_URL: ${{ vars.AWS_ECR_REPOSITORY_URL }}
        run: |
          docker build --no-cache -t "$ECR_URL:${{ github.sha }}" -t "$ECR_URL:latest" .
          docker push "$ECR_URL:${{ github.sha }}"
          docker push "$ECR_URL:latest"

      # Not reachable via a public health-check URL — the AI instance's
      # security group only allows port 8001 from the backend instance, not
      # the internet (see security_groups.tf) — so the health check runs
      # inside this same SSM command instead of a separate curl step.
      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          ECR_URL: ${{ vars.AWS_ECR_REPOSITORY_URL }}
        run: |
          set -euo pipefail
          REGISTRY="${ECR_URL%%/*}"
          COMMANDS=$(jq -n --arg registry "$REGISTRY" '[
            "aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin \($registry)",
            "cd /home/ec2-user",
            "docker-compose pull ai-service",
            "docker-compose up -d --no-deps --force-recreate ai-service",
            "docker image prune -af",
            "for i in $(seq 1 30); do curl -fsS http://localhost:8001/health && exit 0; sleep 5; done; exit 1"
          ]')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":$COMMANDS}" \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "StandardErrorContent" --output text

          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
